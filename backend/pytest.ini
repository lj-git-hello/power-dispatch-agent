[pytest]
# 本地测试套件统一配置（backend/tests/ 内容不入库，仅本地验证使用）
testpaths = tests

# pytest-asyncio 采用严格模式：异步用例必须显式标注 @pytest.mark.asyncio
asyncio_mode = strict

# 事件循环统一为「会话级」：
#   SQLAlchemy / asyncpg 连接池是模块级全局单例（app.core.database.async_engine），
#   若为不同作用域分配不同事件循环，连接池中的连接会被跨循环复用，触发 asyncpg 的
#   "RuntimeError: got Future attached to a different loop"。
#   生产运行时是「单进程单事件循环」，测试同样统一到会话级，语义与生产一致。
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
