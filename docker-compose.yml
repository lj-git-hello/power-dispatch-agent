version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: power_pg
    environment:
      POSTGRES_USER: power_admin
      POSTGRES_PASSWORD: power_password_2026
      POSTGRES_DB: power_dispatch_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: